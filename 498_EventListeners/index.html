<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Event Listeners Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JavaScript Event Listeners Practice</h1>

    <hr>

    <!-- CLICK EVENT -->

    <section>

        <h2>1. Click Event</h2>

        <button id="clickBtn">Click Me</button>

        <p id="clickResult"></p>

    </section>

    <hr>

    <!-- COUNTER -->

    <section>

        <h2>2. Counter</h2>

        <button id="increaseBtn">Increase</button>

        <h3 id="count">0</h3>

    </section>

    <hr>

    <!-- SUBMIT EVENT -->

    <section>

        <h2>3. Form Submit</h2>

        <form id="myForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Name">

            <button>Submit</button>

        </form>

        <p id="formResult"></p>

    </section>

    <hr>

    <!-- KEYDOWN -->

    <section>

        <h2>4. Keyboard Event</h2>

        <input
            type="text"
            id="keyboardInput"
            placeholder="Type Here">

        <p id="keyResult"></p>

    </section>

    <hr>

    <!-- EVENT BUBBLING -->

    <section>

        <h2>5. Event Bubbling</h2>

        <div id="parent">

            Parent Div

            <button id="childBtn">

                Child Button

            </button>

        </div>

    </section>

    <hr>

    <!-- EVENT DELEGATION -->

    <section>

        <h2>6. Event Delegation</h2>

        <button id="addFruit">

            Add Fruit

        </button>

        <ul id="fruitList">

            <li>Apple</li>

            <li>Mango</li>

            <li>Orange</li>

        </ul>

    </section>

    <hr>

    <!-- REMOVE EVENT -->

    <section>

        <h2>7. Remove Event Listener</h2>

        <button id="helloBtn">

            Say Hello

        </button>

        <button id="removeBtn">

            Remove Listener

        </button>

    </section>

    <script src="script.js"></script>

</body>

</html>
